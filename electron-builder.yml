appId: com.honishi.nico-live-recorder
productName: NicoLiveRecorder
directories:
  buildResources: build
  output: release
files:
  - out/**
  - '!**/.DS_Store'
# 同梱した実体と資料を afterPack で検証し、失敗した成果物は公開させない。
afterPack: scripts/ffmpeg/after-pack.cjs
extraResources:
  - from: resources/proto
    to: proto
  - from: resources/ffmpeg/${platform}-${arch}
    to: ffmpeg
npmRebuild: false
mac:
  # Electron と同梱バイナリを署名し、最後にアプリ全体の署名を確定する。
  sign: scripts/mac/sign.mjs
  type: distribution
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  binaries:
    - Contents/Resources/ffmpeg/ffmpeg
    - Contents/Resources/ffmpeg/ffprobe
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.utilities
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
