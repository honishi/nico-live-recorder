appId: net.honishi.nico-live-recorder
productName: NicoLiveRecorder
directories:
  buildResources: build
  output: release
files:
  - out/**
  - '!**/.DS_Store'
# 同梱した実体と資料を afterPack で検証し、失敗した成果物は公開させない。
afterPack: scripts/ffmpeg/after-pack.cjs
extraResources:
  - from: resources/proto
    to: proto
  - from: resources/ffmpeg/${platform}-${arch}
    to: ffmpeg
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.utilities
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
