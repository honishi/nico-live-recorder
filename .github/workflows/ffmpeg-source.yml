name: Prepare FFmpeg source

on:
  workflow_call:

jobs:
  download:
    # Windowsランナーからffmpeg.orgへの接続がタイムアウトするため、取得を分離する。
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Node組み込みモジュールだけで動く。依存パッケージやコンパイラーは不要。
      - run: node scripts/ffmpeg/build.mjs --download-only
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-source
          path: .cache/ffmpeg/*.tar.xz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
