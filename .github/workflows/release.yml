name: Windows Update Test

# main に存在する Release の手動実行入口から、この試験ブランチを選ぶ。
# タグを push しても本番 Release を作らない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 同じ FFmpeg と同じコードを使い、バージョンだけ変えて2つ作る。
      - uses: ./.github/actions/build-ffmpeg
      - run: npm run build
      - name: Package and verify both test versions
        shell: pwsh
        run: |
          foreach ($testVersion in @('0.5.0', '0.5.1')) {
            npm version $testVersion --no-git-tag-version --ignore-scripts --allow-same-version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npx electron-builder --win --x64 --publish never
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run ffmpeg:verify-artifacts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $artifactDir = "test-artifacts/$testVersion"
            New-Item -ItemType Directory -Force $artifactDir | Out-Null
            Get-ChildItem release -File | Where-Object {
              $_.Extension -in @('.exe', '.blockmap') -or $_.Name -eq 'latest.yml'
            } | Copy-Item -Destination $artifactDir
            @{
              sourceCommit = $env:GITHUB_SHA
              sourceRef = $env:GITHUB_REF
              runId = $env:GITHUB_RUN_ID
              version = $testVersion
              appId = 'com.honishi.nico-live-recorder.update-test'
              updateRepository = 'honishi/nico-live-recorder-update-test'
            } | ConvertTo-Json | Set-Content "$artifactDir/build-info.json" -Encoding utf8
            # このジョブが生成したパッケージだけを除去し、次の版に混ぜない。
            Remove-Item release -Recurse -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-update-test-0.5.0
          path: test-artifacts/0.5.0/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: windows-update-test-0.5.1
          path: test-artifacts/0.5.1/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
