<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ vars }}">
  <div style="width:900px;height:640px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);border:1px solid var(--border-2);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.16)">
    <div style="height:36px;flex-shrink:0;background:var(--titlebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px">
      <div style="display:flex;gap:6px">
        <div style="width:11px;height:11px;border-radius:6px;background:#ff5f57"></div>
        <div style="width:11px;height:11px;border-radius:6px;background:#febc2e"></div>
        <div style="width:11px;height:11px;border-radius:6px;background:#28c840"></div>
      </div>
      <div style="flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--text-2)">Nico Live Recorder</div>
      <div style="width:52px"></div>
    </div>

    <div style="flex-shrink:0;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <div style="font-size:15px;font-weight:600;color:var(--text)">Nico Live Recorder</div>
        <div style="font-size:11px;color:var(--text-3);font-family:var(--mono)">v0.1.0</div>
      </div>
      <sc-if value="{{ live }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)"><span style="width:6px;height:6px;border-radius:3px;background:var(--success)"></span>ログイン中</div>
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)"><span style="width:6px;height:6px;border-radius:3px;background:var(--success)"></span>push 接続済み</div>
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)"><span style="width:6px;height:6px;border-radius:3px;background:var(--success)"></span>監視中 30 秒</div>
        </div>
      </sc-if>
      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--warn)"><span style="width:6px;height:6px;border-radius:3px;background:var(--warn)"></span>未ログイン</div>
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)"><span style="width:6px;height:6px;border-radius:3px;background:var(--border-2)"></span>push 未接続</div>
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)"><span style="width:6px;height:6px;border-radius:3px;background:var(--border-2)"></span>監視停止</div>
        </div>
      </sc-if>
    </div>

    <div style="flex-shrink:0;padding:12px 18px 0;display:flex;gap:20px;border-bottom:1px solid var(--border)">
      <sc-if value="{{ onRec }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:13px;font-weight:600;color:var(--text);padding-bottom:9px;border-bottom:2px solid var(--accent);margin-bottom:-1px;cursor:pointer;display:flex;align-items:center;gap:6px">録画<sc-if value="{{ live }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 6px 1px 5px;border-radius:999px;background:var(--rec);color:#fff"><span style="width:5px;height:5px;border-radius:3px;background:#fff"></span>2</span></sc-if></div>
      </sc-if>
      <sc-if value="{{ offRec }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px;color:var(--text-2);padding-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:6px">録画<sc-if value="{{ live }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 6px 1px 5px;border-radius:999px;background:var(--rec);color:#fff"><span style="width:5px;height:5px;border-radius:3px;background:#fff"></span>2</span></sc-if></div>
      </sc-if>

      <sc-if value="{{ onTargets }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px;font-weight:600;color:var(--text);padding-bottom:9px;border-bottom:2px solid var(--accent);margin-bottom:-1px;cursor:pointer;display:flex;align-items:center;gap:6px">対象<sc-if value="{{ live }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3)">4</span></sc-if></div>
      </sc-if>
      <sc-if value="{{ offTargets }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:13px;color:var(--text-2);padding-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:6px">対象<sc-if value="{{ live }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3)">4</span></sc-if></div>
      </sc-if>

      <sc-if value="{{ onHistory }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px;font-weight:600;color:var(--text);padding-bottom:9px;border-bottom:2px solid var(--accent);margin-bottom:-1px;cursor:pointer">履歴</div>
      </sc-if>
      <sc-if value="{{ offHistory }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:13px;color:var(--text-2);padding-bottom:9px;cursor:pointer">履歴</div>
      </sc-if>

      <sc-if value="{{ onLog }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px;font-weight:600;color:var(--text);padding-bottom:9px;border-bottom:2px solid var(--accent);margin-bottom:-1px;cursor:pointer;display:flex;align-items:center;gap:6px">ログ<sc-if value="{{ live }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--warn-weak);color:var(--warn)">1</span></sc-if></div>
      </sc-if>
      <sc-if value="{{ offLog }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:13px;color:var(--text-2);padding-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:6px">ログ<sc-if value="{{ live }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--warn-weak);color:var(--warn)">1</span></sc-if></div>
      </sc-if>

      <div style="flex:1"></div>

      <sc-if value="{{ onSettings }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px;font-weight:600;color:var(--text);padding-bottom:9px;border-bottom:2px solid var(--accent);margin-bottom:-1px;cursor:pointer">設定</div>
      </sc-if>
      <sc-if value="{{ offSettings }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:13px;color:var(--text-2);padding-bottom:9px;cursor:pointer">設定</div>
      </sc-if>
    </div>

    <div style="flex:1;min-height:0;overflow:hidden;padding:16px 18px;display:flex;flex-direction:column">
      <sc-if value="{{ onRec }}" hint-placeholder-val="{{ true }}">
        <dc-import name="PartRecordings" mode="{{ mode }}" hint-size="100%,420px"></dc-import>
      </sc-if>
      <sc-if value="{{ onTargets }}" hint-placeholder-val="{{ false }}">
        <dc-import name="PartTargets" mode="{{ mode }}" hint-size="100%,300px"></dc-import>
      </sc-if>
      <sc-if value="{{ onHistory }}" hint-placeholder-val="{{ false }}">
        <dc-import name="PartHistory" mode="{{ mode }}" hint-size="100%,420px"></dc-import>
      </sc-if>
      <sc-if value="{{ onLog }}" hint-placeholder-val="{{ false }}">
        <dc-import name="PartLog" hint-size="100%,100%"></dc-import>
      </sc-if>
      <sc-if value="{{ onSettings }}" hint-placeholder-val="{{ false }}">
        <dc-import name="PartSettings" mode="{{ mode }}" hint-size="100%,440px"></dc-import>
      </sc-if>
    </div>

    <div style="height:26px;flex-shrink:0;border-top:1px solid var(--border);background:var(--titlebar);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;color:var(--text-3)">
      <div style="font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">~/Movies/NicoLiveRecorder</div>
      <div style="flex-shrink:0">最終受信 19:26:03</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:920,&quot;height&quot;:660},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;recordings&quot;,&quot;targets&quot;,&quot;history&quot;,&quot;log&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;recordings&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;signedout&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2f6fd0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TOK = {
  light: {'--bg':'#eef0f3','--surface':'#ffffff','--surface-2':'#f7f8fa','--text':'#191c1f','--text-2':'#5f6772','--text-3':'#8d959f','--border':'#e4e7eb','--border-2':'#cdd2d8','--hover':'#f1f3f5','--titlebar':'#e9ebee','--success':'#1c8a4d','--warn':'#a86a06','--rec':'#d92b2b'},
  dark: {'--bg':'#1b1e21','--surface':'#24272b','--surface-2':'#2a2e33','--text':'#e9ebee','--text-2':'#9ba3ad','--text-3':'#737b84','--border':'#33373c','--border-2':'#43484f','--hover':'#2c3035','--titlebar':'#1f2225','--success':'#55c98a','--warn':'#dfa63e','--rec':'#ff6a61'}
};
function themeVars(props) {
  const dark = props.theme === 'dark';
  const accent = props.accent || (dark ? '#6da8f5' : '#2f6fd0');
  const dense = props.density === 'compact';
  return Object.assign({}, dark ? TOK.dark : TOK.light, {
    '--accent': accent,
    '--accent-weak': 'color-mix(in oklab, ' + accent + ' 14%, var(--surface))',
    '--success-weak': 'color-mix(in oklab, var(--success) 15%, var(--surface))',
    '--warn-weak': 'color-mix(in oklab, var(--warn) 17%, var(--surface))',
    '--rec-weak': 'color-mix(in oklab, var(--rec) 9%, var(--surface))',
    '--rec-border': 'color-mix(in oklab, var(--rec) 34%, var(--surface))',
    '--mono': 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    '--pad': dense ? '10px' : '14px',
    '--rowh': dense ? '30px' : '36px',
    fontFamily: '-apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Segoe UI", Meiryo, sans-serif',
    colorScheme: dark ? 'dark' : 'light'
  });
}
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode || 'live';
    const tab = this.props.tab || 'recordings';
    return {
      vars: themeVars(this.props), mode,
      signedOut: mode === 'signedout', live: mode !== 'signedout',
      onRec: tab === 'recordings', offRec: tab !== 'recordings',
      onTargets: tab === 'targets', offTargets: tab !== 'targets',
      onHistory: tab === 'history', offHistory: tab !== 'history',
      onLog: tab === 'log', offLog: tab !== 'log',
      onSettings: tab === 'settings', offSettings: tab !== 'settings'
    };
  }
}
</script>
</body>
</html>
