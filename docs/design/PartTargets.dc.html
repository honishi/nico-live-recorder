<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:8px;align-items:center">
    <input placeholder="ユーザー ID または https://www.nicovideo.jp/user/12345" style="flex:1;min-width:0;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text)" />
    <button style="font-size:12px;font-weight:500;padding:7px 16px;border-radius:6px;border:1px solid transparent;background:var(--accent);color:#fff;cursor:pointer">追加</button>
  </div>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="border:1px dashed var(--border-2);border-radius:8px;background:var(--surface-2);padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
      <div style="font-size:13px;font-weight:600;color:var(--text)">録画対象がまだありません</div>
      <div style="font-size:12px;line-height:1.7;color:var(--text-2);max-width:380px">ニコニコでフォローしている配信者の ID を上の欄に入れて追加します。</div>
    </div>
  </sc-if>
  <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
    <div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden">
      <div style="display:grid;grid-template-columns:44px minmax(0,1.6fr) 104px 96px 52px;gap:10px;align-items:center;padding:0 var(--pad);height:30px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-3)">
        <div>有効</div><div>名前</div><div>ユーザー ID</div><div>フォロー</div><div></div>
      </div>
      <div style="display:grid;grid-template-columns:44px minmax(0,1.6fr) 104px 96px 52px;gap:10px;align-items:center;padding:0 var(--pad);height:var(--rowh);border-bottom:1px solid var(--border);font-size:13px;color:var(--text)">
        <div><input type="checkbox" checked="{{ true }}" style="accent-color:var(--accent);width:14px;height:14px" /></div>
        <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ひとえちゃん</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text-2)">119753713</div>
        <div><span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--success-weak);color:var(--success)">フォロー中</span></div>
        <div><span style="font-size:12px;color:var(--text-3);cursor:pointer">削除</span></div>
      </div>
      <div style="display:grid;grid-template-columns:44px minmax(0,1.6fr) 104px 96px 52px;gap:10px;align-items:center;padding:0 var(--pad);height:var(--rowh);border-bottom:1px solid var(--border);font-size:13px;color:var(--text)">
        <div><input type="checkbox" checked="{{ true }}" style="accent-color:var(--accent);width:14px;height:14px" /></div>
        <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Mr.Tina葬葬</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text-2)">92014771</div>
        <div><span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--success-weak);color:var(--success)">フォロー中</span></div>
        <div><span style="font-size:12px;color:var(--text-3);cursor:pointer">削除</span></div>
      </div>
      <div style="display:grid;grid-template-columns:44px minmax(0,1.6fr) 104px 96px 52px;gap:10px;align-items:center;padding:0 var(--pad);height:var(--rowh);border-bottom:1px solid var(--border);font-size:13px;color:var(--text)">
        <div><input type="checkbox" style="accent-color:var(--accent);width:14px;height:14px" /></div>
        <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-3)">こばやし</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text-3)">3021884</div>
        <div><span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--text-3);border:1px solid var(--border)">無効</span></div>
        <div><span style="font-size:12px;color:var(--text-3);cursor:pointer">削除</span></div>
      </div>
      <div style="display:grid;grid-template-columns:44px minmax(0,1.6fr) 104px 96px 52px;gap:10px;align-items:center;padding:0 var(--pad);height:var(--rowh);font-size:13px;color:var(--text)">
        <div><input type="checkbox" checked="{{ true }}" style="accent-color:var(--accent);width:14px;height:14px" /></div>
        <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">おかゆ</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text-2)">57392011</div>
        <div><span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--warn-weak);color:var(--warn)">未フォロー</span></div>
        <div><span style="font-size:12px;color:var(--text-3);cursor:pointer">削除</span></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.6;color:var(--text-2)">
      <span style="width:5px;height:5px;border-radius:3px;background:var(--warn);flex-shrink:0"></span>
      未フォローの配信者には push 通知が届きません。ポーリングのみで検知します。
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:320},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;signedout&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.mode === 'signedout';
    return { empty, hasRows: !empty };
  }
}
</script>
</body>
</html>
