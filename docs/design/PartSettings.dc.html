<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em">保存</div>
    <div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:var(--pad);display:flex;flex-direction:column;gap:12px">
      <div style="display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center">
        <div style="font-size:13px;color:var(--text-2)">保存先</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">/Users/honishi/Movies/NicoLiveRecorder</div>
        <div style="display:flex;gap:8px">
          <button style="font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer">変更</button>
          <button style="font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer">開く</button>
        </div>
      </div>
      <div style="height:1px;background:var(--border)"></div>
      <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center">
        <div style="font-size:13px;color:var(--text-2)">ポーリング間隔</div>
        <div style="display:flex;align-items:center;gap:8px">
          <input value="30" style="width:64px;font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);text-align:right;font-variant-numeric:tabular-nums" />
          <span style="font-size:13px;color:var(--text-2)">秒</span>
        </div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em">検知と通知</div>
    <div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:var(--pad);display:flex;flex-direction:column;gap:12px">
      <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" checked="{{ true }}" style="accent-color:var(--accent);width:14px;height:14px;margin-top:2px" />
        <span style="display:flex;flex-direction:column;gap:2px">
          <span style="font-size:13px;color:var(--text)">push 通知で放送開始を検知する</span>
          <span style="font-size:12px;line-height:1.6;color:var(--text-3)">切ると検知はポーリングのみになり、最大で間隔ぶん遅れます</span>
        </span>
      </label>
      <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" checked="{{ true }}" style="accent-color:var(--accent);width:14px;height:14px;margin-top:2px" />
        <span style="font-size:13px;color:var(--text)">起動時に放送中だった対象も録画する</span>
      </label>
      <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" checked="{{ true }}" style="accent-color:var(--accent);width:14px;height:14px;margin-top:2px" />
        <span style="font-size:13px;color:var(--text)">録画の開始・終了をデスクトップ通知する</span>
      </label>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em">アカウント</div>
    <div style="border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:var(--pad);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center">
      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <div style="font-size:13px;color:var(--text)">honishi としてログイン中</div>
          <div style="font-size:12px;color:var(--text-3)">push 接続済み — 最終受信 19:26:03</div>
        </div>
        <button style="font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer">ログアウト</button>
      </sc-if>
      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <div style="font-size:13px;color:var(--text)">未ログイン</div>
          <div style="font-size:12px;color:var(--text-3)">ログインすると push 通知で即時に検知できます</div>
        </div>
        <button style="font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid transparent;background:var(--accent);color:#fff;cursor:pointer">ログイン</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:460},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;signedout&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const signedOut = this.props.mode === 'signedout';
    return { signedOut, signedIn: !signedOut };
  }
}
</script>
</body>
</html>
